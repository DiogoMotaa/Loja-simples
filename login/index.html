<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technoblade - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/barra_nav.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/botao.css">
    <link rel="stylesheet" href="../css/login_e_cadastro.css">
</head>
<body>


<!-- 
  Essa é uma separação visual pois
  tenho Problemas com a visão
-->


    <header>
        <nav class="barra-nav">
            <a href="../" class="barra-nav__logo">Technoblade</a>
            <div class="barra-nav__acoes">
                <a href="../cadastro/" class="botao botao--entrar">Cadastre-se</a>
            </div>
        </nav>
    </header>


<!-- 
  Essa é uma separação visual pois
  tenho Problemas com a visão
-->


    <div class="container">
        <div class="caixa-formulario">
            <h2>Entrar</h2>
            <p>Acesse sua conta</p>

            <form>
                <div class="campo">
                    <label>E-mail</label>
                    <input type="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label>Senha</label>
                    <input type="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-acao">Entrar</button>
            </form>

            <div class="link-rodape">
                Não tem conta? <a href="../cadastro/">Cadastre-se</a>
            </div>
        </div>
    </div>

</body>
</html>
